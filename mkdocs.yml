site_name: Machine Unlearning
site_description: Learn how to make a trained AI model forget someone's data, and how to check that it really did. Simple explainers, quizzes and runnable notebooks.
site_author: Shreyan Basu Ray
site_url: https://shreyan1.github.io/machine-unlearning-course/
repo_url: https://github.com/Shreyan1/machine-unlearning-course
repo_name: machine-unlearning-course
edit_uri: ""
copyright: Copyright &copy; 2026 Shreyan Basu Ray. Course material under the MIT licence.

theme:
  name: material
  custom_dir: overrides
  language: en
  font:
    text: Outfit
    code: JetBrains Mono
  icon:
    logo: material/eraser
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips

extra_css:
  - stylesheets/brand.css
extra_javascript:
  - javascripts/quiz.js
  - javascripts/hero.js
  - javascripts/theme.js
  - javascripts/figures.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

hooks:
  - hooks/citations.py
  - hooks/quiz.py
  - hooks/assets.py
  - hooks/practice.py
  - hooks/topics.py
  - hooks/diagrams.py
  - hooks/llms.py

watch:
  - hooks
  - assets/diagrams
  - PRACTICE.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/shreyanbr
      name: Shreyan on X (@shreyanbr)
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/shreyanbasuray
      name: Shreyan on LinkedIn
    - icon: fontawesome/brands/github
      link: https://github.com/Shreyan1/machine-unlearning-course
      name: The course on GitHub
    - icon: material/web
      link: https://shreyanbasuray.com
      name: shreyanbasuray.com
  generator: false

