name: Website

# Builds the MkDocs site from the `website` branch and publishes it to `gh-pages`.
# GitHub Pages serves the `gh-pages` branch (Settings → Pages → Deploy from a branch).
on:
  push:
    branches: [website]
    paths: ["docs/**", "hooks/**", "overrides/**", "mkdocs.yml", "requirements-docs.txt", "assets/diagrams/**", "PRACTICE.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: python tests/test_docs.py
      - run: mkdocs build --strict
      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force --no-history -m "Deploy website from {sha}"
