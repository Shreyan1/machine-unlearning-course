name: Website

# Builds the MkDocs site from the `website` branch and deploys it straight to
# GitHub Pages as an artifact (Settings → Pages → Source: GitHub Actions).
# No branch holds the built HTML.
on:
  push:
    branches: [website]
    paths: ["docs/**", "hooks/**", "overrides/**", "mkdocs.yml", "requirements-docs.txt", "assets/diagrams/**", "PRACTICE.md", "tests/test_docs.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: python tests/test_docs.py
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
